[package]
name = "asc-screen-analyzer"
version = "0.1.7"
edition = "2021"
publish = false

[dependencies]
eframe = "0.28"
xcap = "0.9.7"
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = { version = "0.6.1", default-features = false }
rand = "0.9.5"
