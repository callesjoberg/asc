name: Release
on:
  push:
    tags:
      - 'v*' # Körs när du pushar en tagg som startar med v (t.ex. v0.1.0)
  workflow_dispatch: # Låter dig starta byggnaden manuellt via GitHub Actions fliken

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            build-cmd: 'clang -O3 -framework Foundation -framework AppKit -framework Vision src-ocr/macos/ocr-helper.m -o src-tauri/resources/ocr-helper-macos'
          - platform: 'windows-latest'
            build-cmd: 'dotnet build -c Release src-ocr/windows/OcrHelper.csproj -o src-tauri/resources/ && cp src-tauri/resources/OcrHelper.exe src-tauri/resources/ocr-helper-win.exe'
    
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build OCR Helper
        run: ${{ matrix.build-cmd }}
        shell: bash

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Använder versionen från package.json
          releaseName: 'ASC Screen Analyzer v__VERSION__'
          releaseBody: 'Automatisk byggnation av installerare för Windows (.exe/.msi) och macOS (.dmg).'
          releaseDraft: true
          prerelease: false

      - name: Upload Standalone Windows Executable
        if: matrix.platform == 'windows-latest'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" src-tauri/target/release/tauri-app.exe#ASC_Screen_Analyzer_Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
