name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            build-cmd: 'mkdir -p resources && clang -O3 -framework Foundation -framework AppKit -framework Vision src-ocr/macos/ocr-helper.m -o resources/ocr-helper-macos'
          - platform: 'windows-latest'
            build-cmd: 'mkdir -p resources/ocr-win-publish && dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true src-ocr/windows/OcrHelper.csproj -o resources/ocr-win-publish && cp resources/ocr-win-publish/OcrHelper.exe resources/ocr-helper-win.exe'
    
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build OCR Helper
        run: ${{ matrix.build-cmd }}
        shell: bash

      - name: Build App
        run: cargo build --release
        shell: bash

      - name: Upload Release Asset
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Anteckningar - ASC v$VERSION" \
              --notes "Automatisk byggnation av infödda Rust-binärer (.exe och .tar.gz)." || true

          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/release/asc-screen-analyzer.exe Anteckningar_ASC_Portable.exe
            gh release upload "$TAG" Anteckningar_ASC_Portable.exe --clobber
          else
            tar -czf Anteckningar_ASC_mac.tar.gz -C target/release asc-screen-analyzer
            gh release upload "$TAG" Anteckningar_ASC_mac.tar.gz --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
